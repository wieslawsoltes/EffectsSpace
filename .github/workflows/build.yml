name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Run deterministic engine acceptance tests
        run: dotnet run --project tests/EffectsSpace.Tests -c Release
      - name: Run renderer pixel and export tests
        run: dotnet run --project tests/EffectsSpace.Skia.Tests -c Release
      - name: Snapshot sources
        if: always()
        run: git archive --format=zip --output=/tmp/EffectsSpace-source.zip HEAD
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: EffectsSpace-source
          path: /tmp/EffectsSpace-source.zip
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: EffectsSpace-renderer-validation
          path: artifacts/screenshots
          if-no-files-found: ignore
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install browser tools and verified open typography
        run: |
          dotnet workload install wasm-tools --skip-manifest-update
          python3 scripts/fetch-assets.py
      - name: Publish real Uno WebAssembly application
        run: |
          dotnet publish src/EffectsSpace.App -f net10.0-browserwasm -c Release -o artifacts/publish -p:WasmShellWebAppBasePath=/EffectsSpace/
          python3 scripts/collect-site.py artifacts/publish artifacts/site
      - name: Browser acceptance tests
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium
          python3 scripts/serve-site.py --directory artifacts/site --port 4173 > artifacts/server.log 2>&1 &
          npm run test:browser
          mkdir -p artifacts/site/_preview
          cp artifacts/screenshots/*.png artifacts/site/_preview/
      - name: Package reusable libraries
        run: |
          for project in src/*/*.csproj; do
            case "$project" in */EffectsSpace.App/*) continue;; esac
            dotnet pack "$project" -c Release -o artifacts/packages
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: EffectsSpace-browser
          path: artifacts/site
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: EffectsSpace-packages
          path: artifacts/packages
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: EffectsSpace-browser-validation
          path: |
            artifacts/screenshots
            artifacts/playwright-report
            artifacts/test-results
            artifacts/browser-results.xml
            artifacts/server.log
            package-lock.json
          if-no-files-found: ignore
