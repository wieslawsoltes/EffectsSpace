name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Run deterministic engine acceptance tests
        run: dotnet run --project tests/EffectsSpace.Tests -c Release
      - name: Snapshot sources
        if: always()
        run: git archive --format=zip --output=/tmp/EffectsSpace-source.zip HEAD
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: EffectsSpace-source
          path: /tmp/EffectsSpace-source.zip
