name: Portable Media
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet run --project tests/EffectsSpace.Media.Tests -c Release
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: EffectsSpace-media-performance
          path: artifacts/performance
