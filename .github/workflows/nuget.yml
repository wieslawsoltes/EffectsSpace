name: Publish NuGet
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tested release tag
        type: string
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    timeout-minutes: 30
    steps:
      - name: Validate release reference
        env:
          TAG: ${{ inputs.tag }}
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]'
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: |
          dotnet workload install wasm-tools --skip-manifest-update
          dotnet run --project tests/EffectsSpace.Tests -c Release
          dotnet run --project tests/EffectsSpace.Animation.Tests -c Release
          dotnet run --project tests/EffectsSpace.Skia.Tests -c Release
          dotnet run --project tests/EffectsSpace.Compositing.Tests -c Release
          for project in src/*/*.csproj; do case "$project" in */EffectsSpace.App/*) continue;; esac; dotnet pack "$project" -c Release -o artifacts/packages; done
      - name: Publish explicit release packages
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          test -n "$NUGET_API_KEY" || { echo 'Configure NUGET_API_KEY in the nuget environment.' >&2; exit 1; }
          dotnet nuget push 'artifacts/packages/*.nupkg' --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
