name: Pages
on:
  workflow_run:
    workflows: [Build]
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-main-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Resolve successful trusted main build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REQUESTED_RUN: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          RUN="$REQUESTED_RUN"
          if [ -z "$RUN" ]; then RUN=$(gh api "repos/$REPOSITORY/actions/workflows/build.yml/runs?branch=main&status=success&per_page=20" --jq '[.workflow_runs[] | select(.event != "pull_request")][0].id'); fi
          [[ "$RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$REPOSITORY/actions/runs/$RUN" > /tmp/build.json
          jq -e '.conclusion == "success" and .head_branch == "main" and .event != "pull_request" and .path == ".github/workflows/build.yml"' /tmp/build.json
          SHA=$(jq -r .head_sha /tmp/build.json)
          CURRENT=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)
          test "$SHA" = "$CURRENT" || { echo 'Refusing to deploy a stale commit'; exit 1; }
          echo "run_id=$RUN" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.build.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: EffectsSpace-browser
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}
          path: site
      - name: Verify artifact provenance
        env:
          EXPECTED_SHA: ${{ steps.build.outputs.sha }}
        run: jq -e --arg sha "$EXPECTED_SHA" '.commit == $sha and .runtime == "Uno WebAssembly"' site/build-info.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true
      - name: Deploy verified browser build
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify public application
        env:
          EFFECTSSPACE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ steps.build.outputs.sha }}
        run: |
          curl --fail --retry 8 --retry-all-errors --retry-delay 5 "${EFFECTSSPACE_URL}build-info.json" -o /tmp/live-build.json
          jq -e --arg sha "$EXPECTED_SHA" '.commit == $sha' /tmp/live-build.json
          npm install --ignore-scripts
          npx playwright install --with-deps chromium
          npm run test:browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: EffectsSpace-public-site-validation
          path: |
            artifacts/screenshots
            artifacts/test-results
            artifacts/browser-results.xml
            artifacts/playwright-report
          if-no-files-found: ignore
