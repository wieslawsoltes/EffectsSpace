name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Validate tag syntax
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
  browser:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test engines and publish browser application
        run: |
          dotnet workload install wasm-tools --skip-manifest-update
          python3 scripts/fetch-assets.py
          dotnet run --project tests/EffectsSpace.Tests -c Release
          dotnet run --project tests/EffectsSpace.Animation.Tests -c Release
          dotnet run --project tests/EffectsSpace.Skia.Tests -c Release
          dotnet run --project tests/EffectsSpace.Compositing.Tests -c Release
          dotnet publish src/EffectsSpace.App -f net10.0-browserwasm -c Release -o artifacts/publish -p:WasmShellWebAppBasePath=/EffectsSpace/
          python3 scripts/collect-site.py artifacts/publish artifacts/site
      - name: Validate release browser interactions
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          python3 scripts/serve-site.py --directory artifacts/site --port 4173 > artifacts/server.log 2>&1 &
          npm run test:browser
      - name: Archive browser, sources and reusable packages
        run: |
          mkdir -p artifacts/release
          cd artifacts/site && zip -qr ../release/EffectsSpace-browser.zip . && cd ../..
          git archive --format=zip --output=artifacts/release/EffectsSpace-source.zip HEAD
          for project in src/*/*.csproj; do case "$project" in */EffectsSpace.App/*) continue;; esac; dotnet pack "$project" -c Release -o artifacts/release; done
      - uses: actions/upload-artifact@v7
        with:
          name: release-browser-packages-source
          path: artifacts/release
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: EffectsSpace-release-browser-validation
          path: |
            artifacts/screenshots
            artifacts/test-results
            artifacts/browser-results.xml
          if-no-files-found: ignore
  native:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: python scripts/fetch-assets.py
      - name: Publish self-contained native application
        run: dotnet publish src/EffectsSpace.App -f net10.0-desktop -c Release -r ${{ matrix.rid }} --self-contained true -p:EffectsSpaceDesktopOnly=true -o artifacts/native
      - name: Archive native output
        shell: bash
        run: python -c "import shutil; shutil.make_archive('EffectsSpace-${{ matrix.rid }}', 'zip', 'artifacts/native')"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: EffectsSpace-${{ matrix.rid }}.zip
  publish:
    needs: [validate, browser, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Checksums and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          cd release
          shopt -s nullglob
          FILES=(*.zip *.nupkg *.snupkg)
          ((${#FILES[@]} > 0)) || { echo 'No release payloads were downloaded'; exit 1; }
          sha256sum "${FILES[@]}" > SHA256SUMS.txt
          FLAGS=()
          if [[ "$TAG" == *-* ]]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" --repo "$REPOSITORY" --verify-tag --title "EffectsSpace $TAG" --generate-notes "${FLAGS[@]}" "${FILES[@]}" SHA256SUMS.txt
